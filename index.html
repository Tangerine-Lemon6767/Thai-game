<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ไทยทีละคำ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans+Myanmar:wght@400;600&family=Noto+Sans+Thai+Looped:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow column. A big looped-Thai word card is the centerpiece; Burmese answer buttons stack beneath it. */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --ink: #18232F;
  --muted: #5B6877;
  --line: #D3DAE2;
  --accent: #E3A008;
  --accent-ink: #2A1C00;
  --l0: #2BB3E6; --l1: #F2B91C; --l2: #F0647A; --on-lane: #14181F;
  --good: #14653D;
  --good-bg: #DDF2E5;
  --bad: #A8231B;
  --bad-bg: #FBE3E1;
  --th: "Noto Sans Thai Looped", "Sarabun", "Tahoma", sans-serif;
  --body: "Be Vietnam Pro", "Noto Sans Myanmar", "Padauk", "Myanmar Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161D; --surface: #1A212B; --ink: #E8EDF3; --muted: #9AA7B6; --line: #2C3644;
    --accent: #F0B429; --accent-ink: #231700;
    --good: #6FD39A; --good-bg: #163325; --bad: #FF9B93; --bad-bg: #3A1B19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161D; --surface: #1A212B; --ink: #E8EDF3; --muted: #9AA7B6; --line: #2C3644;
  --accent: #F0B429; --accent-ink: #231700;
  --good: #6FD39A; --good-bg: #163325; --bad: #FF9B93; --bad-bg: #3A1B19;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.8;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-direction: column; gap: 2px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); line-height: 1.4; }
h1 { margin: 0; font-family: var(--th); font-weight: 700; font-size: 2.1rem; line-height: 1.5; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 9px; font-weight: 600; line-height: 1.6; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 14px; line-height: 1.8; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }

.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px 10px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .th { font-family: var(--th); font-size: 1.5rem; font-weight: 600; line-height: 1.5; display: block; overflow-wrap: anywhere; }
.rom { font-size: 13px; color: var(--muted); line-height: 1.4; display: block; }
.row .my { overflow-wrap: anywhere; }

.spk { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; flex: none; }
.nosp .spk { display: none; }

.hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
.hud b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ask { font-size: 14px; color: var(--muted); }
.bigth { font-family: var(--th); font-weight: 700; font-size: clamp(2.6rem, 14vw, 3.8rem); line-height: 1.4; overflow-wrap: anywhere; }
.bigmy { font-weight: 600; font-size: 2rem; line-height: 1.7; overflow-wrap: anywhere; }
.numeral { font-family: var(--th); font-size: 1.2rem; color: var(--muted); }

.opts { display: grid; gap: 10px; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 14px; min-height: 56px; text-align: left; display: flex; flex-direction: column; justify-content: center; overflow-wrap: anywhere; }
.opt.thai { font-family: var(--th); font-size: 1.5rem; font-weight: 600; line-height: 1.5; }
.opt:not(:disabled):hover { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }

.fb { border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.fb.ok { background: var(--good-bg); color: var(--good); }
.fb.no { background: var(--bad-bg); color: var(--bad); }
.fb strong { font-size: 1.1rem; }
.fb .ans { color: var(--ink); display: flex; align-items: center; gap: 12px; }
.fb .ans .th { font-family: var(--th); font-size: 1.4rem; font-weight: 600; }

.primary { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 14px; padding: 8px 18px; min-height: 52px; width: 100%; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 18px; min-height: 52px; width: 100%; }

.score { font-size: 4rem; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums; }
.miss { text-align: left; width: 100%; margin-top: 8px; }
.miss h2 { font-size: 1rem; margin: 0 0 4px; }
.miss .list { border-radius: 12px; }
.stack { display: grid; gap: 10px; }

.cv { display: block; width: 100%; border-radius: 18px; border: 1px solid var(--line); touch-action: manipulation; background: #C9B3EA; }
.lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lane { border: 2px solid var(--line); border-top: 7px solid var(--c); background: var(--surface); border-radius: 12px; padding: 6px; min-height: 60px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.5; overflow-wrap: anywhere; }
.lane.thai { font-family: var(--th); font-size: 1.25rem; font-weight: 600; }
.lane[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--on-lane); font-weight: 600; }
.lane.right { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.lane.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.lane:disabled { cursor: default; }
.reveal { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
.reveal.okc { color: var(--good); }
.reveal.noc { color: var(--bad); }
.hint { text-align: center; margin: 0; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Thai · မြန်မာ</span>
    <h1>ไทยทีละคำ</h1>
    <p class="sub">ထိုင်းစကားလုံးလေးတွေကို တစ်လုံးချင်း လေ့လာကြမယ်</p>
  </header>
  <div id="tabs" class="seg"></div>
  <div id="cats" class="chips"></div>
  <div id="dir"></div>
  <main id="view"></main>
</div>

<script>
const CATS = [
  { id: 'all', my: 'အားလုံး' },
  { id: 'greet', my: 'နှုတ်ဆက်စကား' },
  { id: 'num', my: 'ဂဏန်း' },
  { id: 'food', my: 'အစားအစာ' },
  { id: 'go', my: 'ခရီးသွား' }
];
const W = [
  { c: 'greet', th: 'สวัสดี', rom: 'sa-wat-dee', my: 'မင်္ဂလာပါ' },
  { c: 'greet', th: 'ขอบคุณ', rom: 'khop-khun', my: 'ကျေးဇူးတင်ပါတယ်' },
  { c: 'greet', th: 'ขอโทษ', rom: 'kho-thot', my: 'တောင်းပန်ပါတယ်' },
  { c: 'greet', th: 'ใช่', rom: 'chai', my: 'ဟုတ်ကဲ့' },
  { c: 'greet', th: 'ไม่ใช่', rom: 'mai chai', my: 'မဟုတ်ဘူး' },
  { c: 'greet', th: 'ไม่เป็นไร', rom: 'mai pen rai', my: 'ကိစ္စမရှိပါဘူး' },
  { c: 'greet', th: 'ลาก่อน', rom: 'la kon', my: 'တာ့တာ' },
  { c: 'num', th: 'หนึ่ง', rom: 'nueng', my: 'တစ်', x: '๑' },
  { c: 'num', th: 'สอง', rom: 'song', my: 'နှစ်', x: '๒' },
  { c: 'num', th: 'สาม', rom: 'sam', my: 'သုံး', x: '๓' },
  { c: 'num', th: 'สี่', rom: 'si', my: 'လေး', x: '๔' },
  { c: 'num', th: 'ห้า', rom: 'ha', my: 'ငါး', x: '๕' },
  { c: 'num', th: 'หก', rom: 'hok', my: 'ခြောက်', x: '๖' },
  { c: 'num', th: 'เจ็ด', rom: 'chet', my: 'ခုနစ်', x: '๗' },
  { c: 'num', th: 'แปด', rom: 'paet', my: 'ရှစ်', x: '๘' },
  { c: 'num', th: 'เก้า', rom: 'kao', my: 'ကိုး', x: '๙' },
  { c: 'num', th: 'สิบ', rom: 'sip', my: 'ဆယ်', x: '๑๐' },
  { c: 'food', th: 'ข้าว', rom: 'khao', my: 'ထမင်း' },
  { c: 'food', th: 'น้ำ', rom: 'nam', my: 'ရေ' },
  { c: 'food', th: 'ไก่', rom: 'kai', my: 'ကြက်သား' },
  { c: 'food', th: 'หมู', rom: 'mu', my: 'ဝက်သား' },
  { c: 'food', th: 'ปลา', rom: 'pla', my: 'ငါး' },
  { c: 'food', th: 'ไข่', rom: 'khai', my: 'ကြက်ဥ' },
  { c: 'food', th: 'ผลไม้', rom: 'phon-la-mai', my: 'သစ်သီး' },
  { c: 'food', th: 'อร่อย', rom: 'a-roi', my: 'အရသာရှိတယ်' },
  { c: 'food', th: 'เผ็ด', rom: 'phet', my: 'စပ်တယ်' },
  { c: 'food', th: 'หิว', rom: 'hiu', my: 'ဗိုက်ဆာတယ်' },
  { c: 'go', th: 'ห้องน้ำ', rom: 'hong nam', my: 'အိမ်သာ' },
  { c: 'go', th: 'ตลาด', rom: 'ta-lat', my: 'ဈေး' },
  { c: 'go', th: 'โรงพยาบาล', rom: 'rong pha-ya-ban', my: 'ဆေးရုံ' },
  { c: 'go', th: 'โรงเรียน', rom: 'rong rian', my: 'ကျောင်း' },
  { c: 'go', th: 'ซ้าย', rom: 'sai', my: 'ဘယ်' },
  { c: 'go', th: 'ขวา', rom: 'khwa', my: 'ညာ' },
  { c: 'go', th: 'เท่าไหร่', rom: 'thao rai', my: 'ဘယ်လောက်လဲ' },
  { c: 'go', th: 'แพง', rom: 'phaeng', my: 'ဈေးကြီးတယ်' },
  { c: 'go', th: 'ถูก', rom: 'thuk', my: 'ဈေးသက်သာတယ်' }
];

const SPK = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const $ = s => document.querySelector(s);
const S = { mode: 'learn', cat: 'all', dir: 'th2my', q: null };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pool = () => S.cat === 'all' ? W : W.filter(w => w.c === S.cat);

if (!('speechSynthesis' in window)) document.documentElement.classList.add('nosp');
function say(t) {
  try {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'th-TH'; u.rate = 0.8;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
function getBest() { try { return +localStorage.getItem('thai-best') || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem('thai-best', String(v)); } catch (e) {} }

function spk(w) { return `<button class="spk" data-act="say" data-t="${w.th}" aria-label="နားထောင်မယ်">${SPK}</button>`; }

function startQuiz() {
  const items = shuffle(pool()).slice(0, 10).map(w => {
    const same = W.filter(o => o !== w && (S.cat === 'all' || o.c === w.c));
    const others = shuffle(same.length >= 3 ? same : W.filter(o => o !== w)).slice(0, 3);
    return { w, opts: shuffle([w, ...others]), picked: null };
  });
  S.q = { items, i: 0, score: 0, streak: 0, miss: [], done: false };
}

function renderChrome() {
  $('#tabs').innerHTML = [['learn', 'လေ့လာမယ်'], ['play', 'ကစားမယ်'], ['run', 'ပြေးမယ်']]
    .map(([k, l]) => `<button data-act="mode" data-v="${k}" aria-pressed="${S.mode === k}">${l}</button>`).join('');
  $('#cats').innerHTML = CATS
    .map(c => `<button class="chip" data-act="cat" data-v="${c.id}" aria-pressed="${S.cat === c.id}">${c.my}</button>`).join('');
  $('#dir').innerHTML = S.mode !== 'learn'
    ? `<div class="seg">${[['th2my', 'ထိုင်း → မြန်မာ'], ['my2th', 'မြန်မာ → ထိုင်း']]
        .map(([k, l]) => `<button data-act="dir" data-v="${k}" aria-pressed="${S.dir === k}">${l}</button>`).join('')}</div>`
    : '';
}

function renderLearn() {
  return `<ul class="list">${pool().map(w => `
    <li class="row">
      <div><span class="th">${w.th}</span><span class="rom">${w.rom}${w.x ? ' · ' + w.x : ''}</span></div>
      <div class="my">${w.my}</div>
      ${spk(w)}
    </li>`).join('')}</ul>`;
}

function renderPlay() {
  const q = S.q;
  if (q.done) return renderResult();
  const it = q.items[q.i], w = it.w, t2m = S.dir === 'th2my', answered = it.picked !== null;
  const prompt = t2m
    ? `<span class="ask">ဒီစကားလုံးရဲ့ အဓိပ္ပာယ်က ဘာလဲ။</span><span class="bigth">${w.th}</span><span class="rom">${w.rom}</span>${w.x ? `<span class="numeral">${w.x}</span>` : ''}${spk(w)}`
    : `<span class="ask">ထိုင်းလို ဘယ်လိုပြောလဲ။</span><span class="bigmy">${w.my}</span>`;
  const opts = it.opts.map((o, k) => {
    let cls = 'opt' + (t2m ? '' : ' thai');
    if (answered) { if (o === w) cls += ' right'; else if (k === it.picked) cls += ' wrong'; }
    const inner = t2m ? o.my : `${o.th}<span class="rom" style="font-family:var(--body)">${answered ? o.rom : ''}</span>`;
    return `<button class="${cls}" data-act="pick" data-k="${k}" ${answered ? 'disabled' : ''}>${inner}</button>`;
  }).join('');
  const ok = answered && it.opts[it.picked] === w;
  const fb = answered ? `
    <div class="fb ${ok ? 'ok' : 'no'}" role="status">
      <strong>${ok ? 'မှန်ပါတယ်!' : 'မှားသွားပါပြီ'}</strong>
      <div class="ans"><span class="th">${w.th}</span><span>${w.rom} = ${w.my}</span>${spk(w)}</div>
    </div>
    <button class="primary" data-act="next">${q.i === q.items.length - 1 ? 'ရလဒ်ကြည့်မယ်' : 'ရှေ့ဆက်မယ်'}</button>` : '';
  return `
    <div class="stack">
      <div class="hud"><span><b>${q.i + 1}</b> / ${q.items.length}</span><span>ရမှတ် <b>${q.score}</b></span><span>ဆက်တိုက်မှန် <b>${q.streak}</b></span></div>
      <div class="bar"><i style="width:${(q.i / q.items.length) * 100}%"></i></div>
      <div class="card">${prompt}</div>
      <div class="opts">${opts}</div>
      ${fb}
    </div>`;
}

function renderResult(q = S.q) {
  const n = q.items.length, pct = Math.round(q.score / n * 100);
  const best = getBest();
  const msg = pct >= 90 ? 'အရမ်းတော်ပါတယ်!' : pct >= 60 ? 'ကောင်းပါတယ်၊ ဆက်လေ့ကျင့်ပါ' : 'ထပ်ကြိုးစားကြည့်ရအောင်';
  const miss = q.miss.length ? `
    <div class="miss"><h2>ပြန်လေ့လာရန်</h2>
      <ul class="list">${q.miss.map(w => `<li class="row"><div><span class="th">${w.th}</span><span class="rom">${w.rom}</span></div><div class="my">${w.my}</div>${spk(w)}</li>`).join('')}</ul>
    </div>` : '';
  return `
    <div class="stack">
      <div class="card">
        <span class="ask">ပြီးပါပြီ!</span>
        <span class="score">${q.score}/${n}</span>
        <span>${msg}</span>
        <span class="rom">အမြင့်ဆုံးရမှတ် ${Math.max(best, pct)}%</span>
        ${miss}
      </div>
      <button class="primary" data-act="again">ထပ်ကစားမယ်</button>
      <button class="ghost" data-act="mode" data-v="learn">စကားလုံးတွေ ပြန်လေ့လာမယ်</button>
    </div>`;
}

function render() {
  renderChrome();
  if (S.mode === 'run') { if (R && R.done) $('#view').innerHTML = renderResult(R); else mountRun(); }
  else $('#view').innerHTML = S.mode === 'learn' ? renderLearn() : renderPlay();
}

/* ---------- Runner mode: pseudo-3D road, three gates, pick a lane ---------- */
let R = null;
const Z0 = 2.6, ZFAR = 14, DUR = 7;
const LCOL = ['#2BB3E6', '#F2B91C', '#F0647A'];
const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function buildRun() {
  if (R && R.raf) cancelAnimationFrame(R.raf);
  const items = shuffle(pool()).slice(0, 6).map(w => {
    const same = W.filter(o => o !== w && (S.cat === 'all' || o.c === w.c));
    const others = shuffle(same.length >= 2 ? same : W.filter(o => o !== w)).slice(0, 2);
    return { w, opts: shuffle([w, ...others]) };
  });
  R = { items, round: 0, score: 0, streak: 0, miss: [], lane: 1, lanef: 1, state: 'run', z: Z0, scroll: 0, t: 0, passT: 0, ok: false, chosen: 1, fx: null, done: false, raf: 0, last: 0, VW: 0, VH: 0, cv: null, ctx: null };
}

function mountRun() {
  $('#view').innerHTML = `<div class="stack">
    <div id="runhud" class="hud"></div>
    <div id="runcard" class="card"></div>
    <canvas id="cv" class="cv" role="img" aria-label="ထိုင်းစကားလုံး ပြေးကစားကွင်း"></canvas>
    <div id="runlanes" class="lanes"></div>
    <p class="rom hint">အဖြေမှန်တဲ့ လမ်းကို ရွေးပါ။ အောက်က ခလုတ်ကို နှိပ်ပါ၊ ဒါမှမဟုတ် ပုံရဲ့ ဘယ်/ညာဘက်ကို ထိပါ။</p>
  </div>`;
  R.cv = $('#cv'); R.ctx = R.cv.getContext('2d'); R.VW = 0; R.last = 0;
  R.cv.addEventListener('pointerdown', e => {
    const r = R.cv.getBoundingClientRect();
    moveLane(e.clientX - r.left < r.width / 2 ? -1 : 1);
  });
  runUI();
  R.raf = requestAnimationFrame(loop);
}

function runHud() {
  $('#runhud').innerHTML = `<span>ပတ် <b>${Math.min(R.round + 1, R.items.length)}</b> / ${R.items.length}</span><span>ရမှတ် <b>${R.score}</b></span><span>ဆက်တိုက်မှန် <b>${R.streak}</b></span>`;
}
function runCard() {
  const it = R.items[R.round], w = it.w, t2m = S.dir === 'th2my', pass = R.state === 'pass';
  let h = t2m
    ? `<span class="ask">ဒီစကားလုံးရဲ့ အဓိပ္ပာယ်က ဘာလဲ။</span><span class="bigth" style="font-size:clamp(2.2rem,11vw,3rem)">${w.th}</span><span class="rom">${w.rom}</span>${spk(w)}`
    : `<span class="ask">ထိုင်းလို ဘယ်လိုပြောလဲ။</span><span class="bigmy" style="font-size:1.7rem">${w.my}</span>`;
  if (pass) h += `<span class="reveal ${R.ok ? 'okc' : 'noc'}">${R.ok ? 'မှန်ပါတယ်!' : 'မှားသွားပါပြီ'} · ${w.th} (${w.rom}) = ${w.my}${t2m ? '' : spk(w)}</span>`;
  $('#runcard').innerHTML = h;
}
function runLanes() {
  const it = R.items[R.round], t2m = S.dir === 'th2my', pass = R.state === 'pass';
  $('#runlanes').innerHTML = it.opts.map((o, i) => {
    let cls = 'lane' + (t2m ? '' : ' thai');
    if (pass) { if (o === it.w) cls += ' right'; else if (i === R.chosen) cls += ' wrong'; }
    return `<button class="${cls}" data-act="lane" data-k="${i}" style="--c:var(--l${i})" aria-pressed="${R.lane === i}" ${pass ? 'disabled' : ''}>${t2m ? o.my : o.th}</button>`;
  }).join('');
}
function runUI() { runHud(); runCard(); runLanes(); }

function setLane(k) {
  if (!R || R.state !== 'run') return;
  R.lane = Math.max(0, Math.min(2, k));
  document.querySelectorAll('#runlanes .lane').forEach((b, i) => b.setAttribute('aria-pressed', String(i === R.lane)));
}
function moveLane(d) { if (R) setLane(R.lane + d); }
document.addEventListener('keydown', e => {
  if (S.mode !== 'run' || !R || R.done) return;
  if (e.key === 'ArrowLeft' || e.key === 'a') moveLane(-1);
  else if (e.key === 'ArrowRight' || e.key === 'd') moveLane(1);
});

function resolveRun() {
  const it = R.items[R.round];
  R.chosen = R.lane; R.ok = it.opts[R.lane] === it.w;
  if (R.ok) { R.score++; R.streak++; } else { R.streak = 0; R.miss.push(it.w); }
  R.state = 'pass'; R.passT = 0;
  R.fx = { text: R.ok ? 'တော်လိုက်တာ!' : 'မှားသွားပါပြီ', ok: R.ok, age: 0 };
  runUI();
}
function advanceRun() {
  if (R.round < R.items.length - 1) {
    R.round++; R.z = Z0; R.state = 'run'; R.passT = 0; R.fx = null;
    runUI();
  } else {
    R.done = true;
    const pct = Math.round(R.score / R.items.length * 100);
    if (pct > getBest()) setBest(pct);
    $('#view').innerHTML = renderResult(R);
  }
}

function loop(ts) {
  if (!R || !R.cv || !R.cv.isConnected || R.done) { if (R) R.raf = 0; return; }
  const dt = Math.min(0.05, (ts - (R.last || ts)) / 1000);
  R.last = ts;
  const speed = Z0 / DUR;
  R.t += dt; R.scroll += dt * speed;
  R.lanef += (R.lane - R.lanef) * Math.min(1, dt * 12);
  R.z -= dt * speed;
  if (R.state === 'run') { if (R.z <= 0) resolveRun(); }
  else { R.passT += dt; if (R.fx) R.fx.age += dt; if (R.passT > 1.8) advanceRun(); }
  if (!R.done) drawRun();
  if (R && !R.done) R.raf = requestAnimationFrame(loop);
}

function rr(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function drawRun() {
  const c = R.ctx, cv = R.cv, dpr = window.devicePixelRatio || 1;
  const cw = cv.clientWidth, ch = Math.round(Math.min(cw * 1.05, Math.max(300, innerHeight * 0.5)));
  if (cw !== R.VW || ch !== R.VH) { R.VW = cw; R.VH = ch; cv.style.height = ch + 'px'; cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr); }
  const VW = R.VW, VH = R.VH;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const hy = VH * 0.2, gy = VH * 0.84, halfN = VW * 0.5, cx = VW / 2;
  const P = z => { const s = 1 / (1 + z); return { s, y: hy + (gy - hy) * s, hw: halfN * s }; };
  const quad = (za, zb, f1, f2, col) => {
    const a = P(za), b = P(zb);
    c.fillStyle = col; c.beginPath();
    c.moveTo(cx + f1 * a.hw, a.y); c.lineTo(cx + f2 * a.hw, a.y);
    c.lineTo(cx + f2 * b.hw, b.y); c.lineTo(cx + f1 * b.hw, b.y);
    c.closePath(); c.fill();
  };
  // sky
  const g = c.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#A98BDC'); g.addColorStop(1, '#D8C6F2');
  c.fillStyle = g; c.fillRect(0, 0, VW, VH);
  c.save();
  if (R.state === 'pass' && !R.ok && !REDUCE) c.translate(Math.sin(R.passT * 50) * 5 * Math.max(0, 1 - R.passT / 0.7), 0);

  // road: base, scrolling light bands with lane dashes, white edges
  quad(-0.6, ZFAR, -1, 1, '#3B42D6');
  const seg = 0.9, off = R.scroll % (seg * 2);
  for (let k = -1; k < 18; k++) {
    let z0 = k * seg - off, z1 = z0 + seg;
    if (z1 <= -0.6 || z0 >= ZFAR) continue;
    z0 = Math.max(z0, -0.6); z1 = Math.min(z1, ZFAR);
    if (((k % 2) + 2) % 2 === 0) {
      quad(z0, z1, -1, 1, '#4B53E8');
      quad(z0, z1, -0.345, -0.325, 'rgba(255,255,255,.85)');
      quad(z0, z1, 0.325, 0.345, 'rgba(255,255,255,.85)');
    }
  }
  quad(-0.6, ZFAR, -1, -0.975, '#FFFFFF'); quad(-0.6, ZFAR, 0.975, 1, '#FFFFFF');

  // side pillars
  const pz = 2.4, po = R.scroll % pz, base = Math.floor(R.scroll / pz), ps = [];
  for (let k = 0; k < 7; k++) { const z = k * pz - po; if (z > -0.3 && z < ZFAR) ps.push({ z, k: k + base }); }
  ps.sort((a, b) => b.z - a.z);
  for (const q of ps) {
    const p = P(q.z);
    for (const sd of [-1, 1]) {
      const rw = p.hw * 2, pw = rw * 0.07, ph = rw * 0.3, x = cx + sd * p.hw * 1.14;
      c.fillStyle = ((q.k + (sd > 0 ? 1 : 0)) % 2) ? '#E5484D' : '#F7C93C';
      rr(c, x - pw / 2, p.y - ph, pw, ph, pw * 0.3); c.fill();
      c.fillStyle = 'rgba(255,255,255,.28)'; c.fillRect(x - pw / 2, p.y - ph, pw * 0.28, ph);
    }
  }
  // horizon haze
  const hz = c.createLinearGradient(0, hy - 4, 0, hy + VH * 0.22);
  hz.addColorStop(0, 'rgb(178,151,224)'); hz.addColorStop(1, 'rgba(178,151,224,0)');
  c.fillStyle = hz; c.fillRect(0, hy - 4, VW, VH * 0.26);

  const drawGates = alpha => {
    const it = R.items[R.round], z = R.z;
    if (alpha <= 0 || z < -0.5) return;
    const p = P(z), laneW = p.hw * 2 / 3, gw = laneW * 0.84, gh = gw * 1.1, f = Math.max(3, gw * 0.07), by = p.y;
    const t2m = S.dir === 'th2my';
    c.save(); c.globalAlpha = alpha;
    it.opts.forEach((o, i) => {
      const gx = cx + (i - 1) * laneW;
      c.fillStyle = 'rgba(20,20,60,.25)'; c.beginPath(); c.ellipse(gx, by, gw * 0.5, gw * 0.07, 0, 0, Math.PI * 2); c.fill();
      let bc = '#FFFFFF';
      if (R.state === 'pass') { if (o === it.w) bc = '#CDF0D8'; else if (i === R.chosen) bc = '#F9D1CC'; }
      c.fillStyle = bc; c.fillRect(gx - gw / 2 + f, by - gh + f * 1.4, gw - 2 * f, gh - f * 1.4);
      c.fillStyle = LCOL[i];
      rr(c, gx - gw / 2, by - gh, f, gh, f * 0.4); c.fill();
      rr(c, gx + gw / 2 - f, by - gh, f, gh, f * 0.4); c.fill();
      rr(c, gx - gw / 2, by - gh, gw, f * 1.5, f * 0.5); c.fill();
      const txt = t2m ? o.my : o.th;
      const fam = t2m ? '"Noto Sans Myanmar", sans-serif' : '"Noto Sans Thai Looped", sans-serif', wt = t2m ? 600 : 700;
      let fs = Math.min(gh * 0.3, 44); const maxW = gw - 2 * f - gw * 0.08;
      c.font = `${wt} ${fs}px ${fam}`;
      while (c.measureText(txt).width > maxW && fs > 6) { fs -= 1; c.font = `${wt} ${fs}px ${fam}`; }
      c.fillStyle = '#1B2330'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(txt, gx, by - gh * 0.45);
    });
    c.restore();
  };

  const drawBlob = () => {
    const laneW1 = halfN * 2 / 3, bx = cx + (R.lanef - 1) * laneW1, r = laneW1 * 0.26;
    const bob = REDUCE ? 0 : Math.abs(Math.sin(R.t * 9)) * r * 0.22, by = gy - bob;
    const sad = R.state === 'pass' && !R.ok;
    c.fillStyle = 'rgba(20,20,60,.28)'; c.beginPath(); c.ellipse(bx, gy + 2, r * 0.95 - bob * 0.3, r * 0.26, 0, 0, Math.PI * 2); c.fill();
    for (const sd of [-1, 1]) {
      c.fillStyle = '#F58BAE'; c.beginPath(); c.arc(bx + sd * r * 0.68, by - r * 1.78, r * 0.36, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#FFC4D8'; c.beginPath(); c.arc(bx + sd * r * 0.68, by - r * 1.78, r * 0.2, 0, Math.PI * 2); c.fill();
    }
    const bg = c.createRadialGradient(bx - r * 0.3, by - r * 1.4, r * 0.1, bx, by - r, r * 1.1);
    bg.addColorStop(0, '#FFC0D4'); bg.addColorStop(1, '#F4789F');
    c.fillStyle = bg; c.beginPath(); c.arc(bx, by - r, r, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#2A1F3D';
    for (const sd of [-1, 1]) { c.beginPath(); c.arc(bx + sd * r * 0.34, by - r * 1.1, r * 0.1, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = 'rgba(255,255,255,.9)';
    for (const sd of [-1, 1]) { c.beginPath(); c.arc(bx + sd * r * 0.34 - r * 0.03, by - r * 1.14, r * 0.035, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = 'rgba(255,70,110,.4)';
    for (const sd of [-1, 1]) { c.beginPath(); c.ellipse(bx + sd * r * 0.58, by - r * 0.82, r * 0.17, r * 0.1, 0, 0, Math.PI * 2); c.fill(); }
    c.strokeStyle = '#2A1F3D'; c.lineWidth = Math.max(1.5, r * 0.06); c.lineCap = 'round';
    c.beginPath();
    if (sad) c.arc(bx, by - r * 0.62, r * 0.14, Math.PI * 1.15, Math.PI * 1.85);
    else c.arc(bx, by - r * 0.84, r * 0.14, Math.PI * 0.15, Math.PI * 0.85);
    c.stroke();
  };

  if (R.z > 0) drawGates(1);
  drawBlob();
  if (R.z <= 0) drawGates(Math.max(0, 1 + R.z * 2.2));

  if (R.fx) {
    const a = R.fx.age, al = a < 1 ? 1 : Math.max(0, 1 - (a - 1) / 0.6), fs = VH * 0.085, ty = VH * 0.36 - a * 24;
    c.save(); c.globalAlpha = al;
    c.font = `700 ${fs}px "Noto Sans Myanmar", sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.lineWidth = fs * 0.18; c.lineJoin = 'round'; c.strokeStyle = '#2A1F5C';
    c.fillStyle = R.fx.ok ? '#FFD84D' : '#FF9A90';
    c.strokeText(R.fx.text, cx, ty); c.fillText(R.fx.text, cx, ty);
    c.restore();
  }
  c.restore();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'say') { say(b.dataset.t); return; }
  if (act === 'lane') { setLane(+b.dataset.k); return; }
  if (act === 'mode') { S.mode = v; if (v === 'play') startQuiz(); else if (v === 'run') buildRun(); }
  else if (act === 'cat') { S.cat = v; if (S.mode === 'play') startQuiz(); else if (S.mode === 'run') buildRun(); }
  else if (act === 'dir') { S.dir = v; if (S.mode === 'run') buildRun(); else startQuiz(); }
  else if (act === 'again') { if (S.mode === 'run') buildRun(); else startQuiz(); }
  else if (act === 'pick') {
    const q = S.q, it = q.items[q.i];
    if (it.picked !== null) return;
    it.picked = +b.dataset.k;
    if (it.opts[it.picked] === it.w) { q.score++; q.streak++; }
    else { q.streak = 0; q.miss.push(it.w); }
  } else if (act === 'next') {
    const q = S.q;
    if (q.i < q.items.length - 1) q.i++;
    else {
      q.done = true;
      const pct = Math.round(q.score / q.items.length * 100);
      if (pct > getBest()) setBest(pct);
    }
  }
  render();
});

render();
</script>

</body>
</html>
